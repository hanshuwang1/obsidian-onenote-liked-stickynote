name: Release Obsidian plugin

on:
  push:
    # 只有以数字开头的 tag 才触发发布（版本号形如 1.0.1）。
    # 原来的 "*" 会让任意 tag 都尝试发布。
    tags:
      - "[0-9]*"

# GitHub 自 2023 年起把新仓库的 GITHUB_TOKEN 默认设为只读，
# 不再显式声明权限时创建 release 会 403：
#   Resource not accessible by integration
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Obsidian 要求 release 的 tag 与 manifest.json 的 version 完全一致
      # （不带 v 前缀）。不一致时直接失败，避免发出装不上的版本。
      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p 'require("./manifest.json").version')"
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$tag' does not match manifest.json version '$version'"
            exit 1
          fi

      # 用 gh cli 直接发版：checkout@v2 / setup-node@v1 / create-release@v1 /
      # upload-release-asset@v1 都已废弃（后两个仓库已归档），
      # 且 ::set-output 已被 GitHub 标记为即将禁用。
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            main.js manifest.json styles.css
